# Template for the `web` image: the nginx entrypoint substitutes ${API_UPSTREAM}, ${NGINX_CLIENT_MAX_BODY_SIZE} and
# ${NGINX_BACKUP_TIMEOUT} (set in the Dockerfile, overridable from compose) and writes /etc/nginx/conf.d/default.conf.

upstream cuka_api {
    server ${API_UPSTREAM};
    keepalive 16;
}

server {
    # IPv4 only: a hard-coded [::] listen fails on hosts without IPv6.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Backup archives are uploaded through /api/admin/backups (post media goes straight to MinIO).
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml
               application/rss+xml image/svg+xml font/ttf font/otf application/manifest+json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        proxy_pass http://cuka_api;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Multi-GB backup uploads and downloads: stream both ways instead of spooling to nginx temp files.
    location /api/admin/backups {
        proxy_pass http://cuka_api;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout ${NGINX_BACKUP_TIMEOUT};
        proxy_send_timeout ${NGINX_BACKUP_TIMEOUT};
        send_timeout ${NGINX_BACKUP_TIMEOUT};
    }

    # Open Graph pages for link previews. Trailing slash on purpose: /og-default.png is a static file.
    location /og/ {
        proxy_pass http://cuka_api;
    }

    # Vite's content-hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback; index.html itself is always revalidated so a deploy is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
